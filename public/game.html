<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palpitômetro NicoStadium</title>
    <link rel="stylesheet" href="./css/game.css">
    <link rel="stylesheet" href="./css/globalStyles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body onload="loadTeams()">
    <div id="mask" onclick="disappearMask()"></div>

    <a href="../dashboard/dashboard.html">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        Sair
    </a>

    <main>
        <div class="competition-container">
            <div class="teams-card">
                <img src="./assets/imgs/logo-champions.png" alt="Logo UEFA Champions League" class="competition-logo">

                <div id="champions-team-container">

                </div>
            </div>

            <button id="clash-button-champions" onclick="generateClash('champions')">Gerar Confronto</button>
        </div>

        <div class="competition-container">
            <div class="teams-card">
                <img src="./assets/imgs/logo-libertadores.png" alt="Logo Copa Libertadores" class="competition-logo">

                <div id="libertadores-teams-container">

                </div>
            </div>

            <button id="clash-button-libertadores" onclick="generateClash('libertadores')">Gerar Confronto</button>
        </div>
    </main>

    <dialog id="generator-box">
        <h1>Confronto gerado!</h1>

        <div class="dialog-container">
            <div class="home-team-container">
                <img src="" alt="" style="width: 100px;" id="home-team-logo">
                <button id="home-team-button" onclick="userChoice('homeTeam')"></button>
            </div>

            <div class="scoreboard-container">
                <div class="scoreboard">
                    <span id="home-team-goals">?</span>
                    <img src="./assets/imgs/versus.png" alt="" style="width: 100px;">
                    <span id="visiting-team-goals">?</span>
                </div>

                <button onclick="userChoice('draw')" id="draw-button">Empate</button>
            </div>

            <div class="visiting-team-container">
                <img src="" alt="" style="width: 100px;" id="visiting-team-logo">
                <button id="visiting-team-button" onclick="userChoice('visitingTeam')"></button>
            </div>
        </div>

        <button id="show-result-button">Ver resultado</button>
    </dialog>
</body>

</html>
<script src="./js/game.js"></script>
