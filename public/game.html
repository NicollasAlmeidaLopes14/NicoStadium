<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palpitômetro NicoStadium</title>
    <link rel="stylesheet" href="./css/game.css">
    <link rel="stylesheet" href="./css/globalStyles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body onload="loadTeams()">
    <a href="../dashboard/dashboard.html">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        Sair
    </a>

    <main>
        <div class="competition-container">
            <div class="teams-card">
                <img src="./assets/imgs/logo-champions.png" alt="Logo UEFA Champions League" class="competition-logo">

                <div id="champions-team-container">

                </div>
            </div>

            <button>Gerar Confronto</button>
        </div>

        <div class="competition-container">
            <div class="teams-card">
                <img src="./assets/imgs/logo-libertadores.png" alt="Logo Copa Libertadores" class="competition-logo">

                <div id="libertadores-teams-container">

                </div>
            </div>

            <button onclick="">Gerar Confronto</button>
        </div>
    </main>
</body>

</html>
<script src="./js/game.js"></script>
